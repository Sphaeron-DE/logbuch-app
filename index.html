<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Logbuch Tageseintrag</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Logbuch">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f2ea">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f5f2ea; --card:#fffdf8; --ink:#1e2a24; --muted:#66706a; --line:#e2ddd0;
  --accent:#2f6b57; --accent-ink:#ffffff; --accent-soft:#e2efe8;
  --warn:#9a5b12; --warn-soft:#f8ead2; --bad:#a23b2c; --bad-soft:#f6e1dc;
  --chip:#efebe1; --shadow:0 1px 2px rgba(40,35,20,.06),0 4px 14px rgba(40,35,20,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131714; --card:#1b201c; --ink:#e8e5dc; --muted:#9aa39c; --line:#2c332e;
  --accent:#7cc4a6; --accent-ink:#0f1a15; --accent-soft:#1f3229;
  --warn:#e3b06a; --warn-soft:#3a2d18; --bad:#ec8f80; --bad-soft:#3d221d;
  --chip:#252b26; --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#131714; --card:#1b201c; --ink:#e8e5dc; --muted:#9aa39c; --line:#2c332e;
  --accent:#7cc4a6; --accent-ink:#0f1a15; --accent-soft:#1f3229;
  --warn:#e3b06a; --warn-soft:#3a2d18; --bad:#ec8f80; --bad-soft:#3d221d;
  --chip:#252b26; --shadow:none; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Source Sans 3",-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;text-wrap:balance}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  padding-block:10px 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.nav{display:flex;align-items:center;gap:8px}
.nav h1{flex:1;text-align:center;font-size:1.3rem;line-height:1.2}
.nav h1 small{display:block;font:500 .78rem "Source Sans 3",sans-serif;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  font-size:1.3rem;display:grid;place-items:center;cursor:pointer}
.iconbtn:disabled{opacity:.35}
.todaybtn{font:600 .8rem "Source Sans 3",sans-serif;padding:4px 10px;border-radius:99px;border:1px solid var(--line);
  background:var(--card);color:var(--accent);cursor:pointer}

.notice{border-radius:12px;padding:10px 12px;font-size:.92rem;margin-bottom:12px}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}

section.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:14px 14px 16px;margin-bottom:14px;display:flex;flex-direction:column;gap:14px}
section.card>h2{font-size:1.08rem;display:flex;align-items:baseline;gap:8px}
section.card>h2 span{font:500 .75rem "Source Sans 3",sans-serif;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:.03em}
.lbl em{font-style:normal;font-weight:400}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.row.bottom{grid-template-columns:repeat(auto-fit,minmax(96px,1fr));align-items:end}
.changed .lbl::after{content:" ●";color:var(--accent)}

input[type=text],input[type=time],input[type=number],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}

.seg{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:99px;padding:8px 14px;
  font:500 .95rem "Source Sans 3",sans-serif;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.pending{border-style:dashed;border-color:var(--accent);background:var(--accent-soft)}
.chip.other{font-style:italic}
.chip .lvl{font-size:.78rem;opacity:.85;font-weight:600}
.emoji{gap:6px}
.emoji{flex-wrap:nowrap}
.emoji .chip{font-size:1.3rem;padding:2px 8px;min-height:42px}

.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:1.2rem;cursor:pointer}
.stepper input{text-align:center;width:64px;flex:none}

.meal{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.meal:first-of-type{border-top:0;padding-top:0}
.meal h3{margin:0;font:600 1rem "Source Sans 3",sans-serif}
.mealtext{font-size:.88rem;color:var(--muted);white-space:pre-line;background:var(--bg);border-radius:10px;padding:8px 10px}
.levels{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--accent-soft);border-radius:12px;padding:8px 10px}
.levels b{font-weight:600;margin-right:4px}
.levels .chip{min-height:36px;padding:6px 12px;background:var(--card)}
.levels .chip.on{background:var(--accent);color:var(--accent-ink)}
.linkbtn{background:none;border:0;color:var(--accent);font:600 .9rem "Source Sans 3",sans-serif;padding:6px 0;cursor:pointer;text-align:left}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-family:Fraunces,Georgia,serif;font-size:1.2rem;font-weight:600}
.stat span{font-size:.72rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.stat small{display:block;font-size:.75rem;color:var(--muted);margin-top:2px}
.ro{font-size:.95rem}

.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.savebar .in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.savebar .count{flex:1;font-size:.92rem;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:12px 18px;font:600 1rem "Source Sans 3",sans-serif;cursor:pointer;min-height:46px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:7;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.95rem;max-width:calc(100% - 32px)}
.timepick{display:flex;align-items:center;gap:6px}
.timepick button{width:44px;height:44px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);
  font:600 .85rem "Source Sans 3",sans-serif;cursor:pointer}
.timepick .tval{flex:1;min-width:0;width:auto;height:44px;font:600 1.25rem Fraunces,Georgia,serif;background:var(--bg);color:var(--ink);letter-spacing:.02em}
.timepick .tval.sugg{color:var(--muted);border-style:dashed;font-weight:500}
.stats.two{grid-template-columns:1fr 1fr}
.hint{font-size:.85rem;color:var(--muted)}
.btn.small{min-height:40px;padding:8px 16px;align-self:flex-start}
input[type=search]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;-webkit-appearance:none}
body.typing .savebar{display:none}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.demo{font-size:.8rem;color:var(--muted);text-align:center;margin:4px 0 10px}
.setup{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.setup p{margin:0;color:var(--muted)}
.setup textarea{min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:.85rem;word-break:break-all}
.setup .actions{display:flex;flex-wrap:wrap;gap:10px}
.foot{text-align:center;margin-top:18px;font-size:.88rem}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer;padding:8px}
.code{display:flex;flex-direction:column;gap:8px}
.code textarea{min-height:80px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem;word-break:break-all}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="nav">
      <button class="iconbtn" id="older" aria-label="Tag davor">‹</button>
      <h1 id="title">Logbuch<small>wird geladen</small></h1>
      <button class="iconbtn" id="newer" aria-label="Tag danach">›</button>
    </div>
  </header>
  <div id="demo" class="demo" hidden>Vorschau mit Beispieldaten · nichts wird gespeichert</div>
  <div id="app"><div class="loading">Lade Tag …</div></div>
</div>

<div class="savebar" id="savebar" hidden>
  <div class="in">
    <div class="count" id="count"></div>
    <button class="btn ghost" id="undo">Verwerfen</button>
    <button class="btn primary" id="save">Speichern</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";

/* ---------- Konfiguration ---------- */
var BASE = ["gut verträglich","leichte Reaktion","starke Reaktion","nicht bewertbar"];
// Symptome und Schlaforte kommen vom Skript (APP_CONFIG in Code.gs)
var SYMPTOMS = [];
var LEVELS = ["leicht","mittel","stark"];
var EMOJI = ["🙂","😐","🙁"];
var ORTE = [];
var SUP_PREFIX = "sup:";

var LABELS = {
  harndrang:"Harndrang nachts", mahlzeiten:"Mahlzeiten", stuhlgang:"Stuhlgang", pollen:"Pollenallergie",
  unvertraeglich:"Unverträglichkeit", bemerkungen:"Bemerkungen", wohlbefinden:"Wohlbefinden", schlaf:"Schlaf",
  bett:"Zu Bett gegangen", aufstehen:"Aufstehen", aufwachen:"Nächtliches Aufwachen", schlafort:"Schlafort",
  symptome:"Verträglichkeit / Symptome", bew_f:"Bewertung Frühstück", bew_m:"Bewertung Mittag", bew_a:"Bewertung Abendbrot",
  gut:"Gut gemacht", dankbar:"Dankbar", besser:"Verbessern", erkenntnisse:"Erkenntnisse"
};

/* ---------- Server oder Vorschau ---------- */
/* GS   = alte Web-App (Seite kommt von Google, google.script.run)
   API  = eigene App auf dem Home-Bildschirm, ruft das Skript mit Schlüssel auf
   DEMO = Vorschau mit Beispieldaten */
var GS = typeof google !== "undefined" && google.script && google.script.run;
var CONN_KEY = "logbuchVerbindung";
function getConn(){ try { var c = JSON.parse(localStorage.getItem(CONN_KEY) || "null"); return c && c.u && c.k ? c : null; } catch(e){ return null; } }
function setConn(c){ try { if (c) localStorage.setItem(CONN_KEY, JSON.stringify(c)); else localStorage.removeItem(CONN_KEY); } catch(e){} }
/* Der Code steckt zusätzlich in der Adresse (#c=…). Das Home-Bildschirm-Symbol
   merkt sich die Adresse, so geht die Verbindung nicht verloren, auch wenn
   das iPhone den Speicher der Web-App leert. */
function encodeCode(c){ return btoa(JSON.stringify({u:c.u,k:c.k})).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function hashConn(){ var m = /[#&]c=([A-Za-z0-9_\-]+)/.exec(location.hash || ""); if (!m) return null; try { return decodeCode(m[1]); } catch(e){ return null; } }
function setHash(c){ try { history.replaceState(null, "", location.pathname + location.search + (c ? "#c=" + encodeCode(c) : "")); } catch(e){} }
var conn = GS ? null : (hashConn() || getConn());
if (conn && !GS) { setConn(conn); if (!hashConn()) setHash(conn); }
var STANDALONE = !!(window.navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches));
var DEMO = false;
var LIVE = GS || !!conn;

function apiCall(c, fn, arg){
  // Ohne Content-Type-Kopf (= text/plain), damit Google die Anfrage ohne Vorabprüfung annimmt
  return fetch(c.u, { method:"POST", body: JSON.stringify({ key:c.k, fn:fn, arg:arg }) })
    .then(function(r){ if (!r.ok) throw new Error("Server antwortet nicht (" + r.status + ")."); return r.json(); })
    .catch(function(e){ if (e && e.auth) throw e; if (e instanceof SyntaxError || e instanceof TypeError) throw new Error("Keine Verbindung zum Logbuch. Internet da? Bereitstellung auf „Jeder“?"); throw e; })
    .then(function(d){ if (!d.ok) { var err = new Error(d.error || "Unbekannter Fehler"); err.auth = !!d.auth; throw err; } return d.result; });
}
function call(fn, arg){
  if (GS) return new Promise(function(res, rej){ google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](arg); });
  if (conn) return apiCall(conn, fn, arg).catch(function(e){ if (e.auth) { setConn(null); setHash(null); conn = null; LIVE = false; day = null; showSetup("Der Schlüssel passt nicht mehr. Bitte neu verbinden."); } throw e; });
  return new Promise(function(res, rej){ setTimeout(function(){ try { res(MOCK[fn](arg)); } catch(e){ rej(e); } }, 250); });
}

/* ---------- Verbinden (nur eigene App) ---------- */
function decodeCode(t){
  t = String(t || "").replace(/\s+/g, "").replace(/-/g, "+").replace(/_/g, "/");
  while (t.length % 4) t += "=";
  var bin = atob(t), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  var c = JSON.parse(new TextDecoder().decode(bytes));
  if (!c || !/^https:\/\/script\.google\.com\//.test(c.u) || !c.k) throw new Error("bad");
  return { u: c.u, k: c.k };
}
function showSetup(msg){
  document.getElementById("savebar").hidden = true;
  document.getElementById("demo").hidden = true;
  var title = document.getElementById("title");
  title.innerHTML = ""; title.appendChild(document.createTextNode("Logbuch")); title.appendChild(el("small",{text:"einrichten"}));
  document.getElementById("older").disabled = true; document.getElementById("newer").disabled = true;
  var ta = el("textarea",{placeholder:"Verbindungscode hier einfügen", autocomplete:"off", autocorrect:"off", autocapitalize:"off", spellcheck:"false"});
  var btn = el("button",{class:"btn primary",text:"Verbinden"});
  var demoBtn = el("button",{class:"btn ghost",text:"Beispieldaten ansehen"});
  var out = el("div",{class:"notice bad",hidden:true});
  btn.addEventListener("click", function(){
    var c; try { c = decodeCode(ta.value); } catch(e){ out.textContent = "Das ist kein gültiger Verbindungscode. Bitte ganz kopieren."; out.hidden = false; return; }
    btn.disabled = true; btn.textContent = "Prüfe …"; out.hidden = true;
    apiCall(c, "getDay", "").then(function(){
      setConn(c); setHash(c); conn = c; LIVE = true; load("");
      if (!STANDALONE) setTimeout(function(){ toast("Verbunden. Jetzt unten auf Teilen → „Zum Home-Bildschirm“ tippen.", 9000); }, 900);
    }).catch(function(e){
      btn.disabled = false; btn.textContent = "Verbinden";
      out.textContent = e.auth ? "Der Schlüssel passt nicht." : (e.message || String(e)); out.hidden = false;
    });
  });
  demoBtn.addEventListener("click", function(){ DEMO = true; document.getElementById("demo").hidden = false; load(""); });
  var app = document.getElementById("app"); app.innerHTML = "";
  app.appendChild(el("section",{class:"card"},[
    el("h2",{},["Mit dem Logbuch verbinden"]),
    el("div",{class:"setup"},[
      msg ? el("div",{class:"notice warn",text:msg}) : null,
      el("p",{text:"1. Öffne die alte Logbuch-Web-App, tippe ganz unten auf „Neue App verbinden“ und kopiere den Code."}),
      el("p",{text:"2. Öffne diese Seite in Safari, füge den Code hier ein und tippe auf „Verbinden“."}),
      el("p",{text:"3. Erst danach: Teilen → „Zum Home-Bildschirm“. Dann steckt die Verbindung im Symbol."}),
      ta, out,
      el("div",{class:"actions"},[btn, demoBtn])
    ])
  ]));
}
function disconnect(){ setConn(null); setHash(null); conn = null; LIVE = false; day = null; showSetup(); }

/* ---------- Zustand ---------- */
var day = null, orig = {}, cur = {}, openLevel = {}, busy = false, favEdit = false, supQuery = "", supBox = null;

function load(date){
  busy = true; render();
  call("getDay", date || "").then(function(d){
    if (d.config) { SYMPTOMS = d.config.symptome || SYMPTOMS; ORTE = d.config.orte || ORTE; }
    day = d; orig = Object.assign({}, d.fields); cur = Object.assign({}, d.fields); openLevel = {}; favEdit = false; supQuery = "";
    busy = false; render();
  }).catch(function(e){ busy = false; showError(e); });
}

function changes(){
  var list = [];
  Object.keys(cur).forEach(function(k){
    var now = String(cur[k]||"").trim(), was = String(orig[k]||"");
    if (now !== was.trim()) {
      list.push({ date: k === "bett" ? day.prevDate : day.date, key: k, before: was, after: now });
    }
  });
  return list;
}

function set(k, v){ cur[k] = v; render(); }
function markChanged(node, k){
  var f = node.closest(".field");
  if (f) f.classList.toggle("changed", String(cur[k]||"").trim() !== String(orig[k]||"").trim());
}

/* ---------- Bausteine ---------- */
function el(tag, attrs, kids){
  var e = document.createElement(tag);
  Object.keys(attrs||{}).forEach(function(a){
    if (a === "class") e.className = attrs[a];
    else if (a.indexOf("on") === 0) e.addEventListener(a.slice(2), attrs[a]);
    else if (a === "text") e.textContent = attrs[a];
    else e.setAttribute(a, attrs[a]);
  });
  (kids||[]).forEach(function(k){ if (k) e.appendChild(typeof k === "string" ? document.createTextNode(k) : k); });
  return e;
}
function field(k, label, control, hint){
  var lab = el("div",{class:"lbl"},[label || LABELS[k]]);
  if (hint) lab.appendChild(el("em",{text:" · "+hint}));
  return el("div",{class:"field"+((cur[k]||"")!==(orig[k]||"")?" changed":"")},[lab, control]);
}
function text(k, multi, ph){
  var attrs = {spellcheck:"true", autocorrect:"on", autocapitalize:"sentences", autocomplete:"off"};
  if (multi) attrs.rows = "3"; else attrs.type = "text";
  var inp = el(multi?"textarea":"input", attrs);
  inp.value = cur[k]||""; if (ph) inp.placeholder = ph;
  // Während des Tippens nichts an der Seite verändern (sonst stört es Cursor und Autokorrektur am iPhone)
  inp.addEventListener("input", function(){ cur[k] = inp.value; });
  inp.addEventListener("blur", function(){ markChanged(inp, k); updateBar(); });
  return inp;
}
/* Uhrzeit mit Knöpfen statt Drehrad. Leeres Feld zeigt einen Vorschlag (grau),
   der erst durch Antippen oder Verstellen übernommen wird. */
var DEFAULT_TIME = { bett:"21:00", aufstehen:"05:00", aufwachen:"00:30" };
function toMin(t){ var m = /^(\d{1,2}):(\d{2})/.exec(t||""); return m ? (+m[1])*60 + (+m[2]) : null; }
function fmtMin(n){ n = ((n % 1440) + 1440) % 1440; return ("0"+Math.floor(n/60)).slice(-2)+":"+("0"+(n%60)).slice(-2); }
function time(k){
  var has = toMin(cur[k]) !== null;
  var base = has ? toMin(cur[k]) : toMin(DEFAULT_TIME[k] || "00:00");
  function shift(d){
    var n = Math.round((base + d) / 15) * 15;   // auf Viertelstunden runden
    if (k === "aufwachen") n = Math.max(0, Math.min(n, 12*60));
    set(k, fmtMin(n));
  }
  function b(label, d){ return el("button",{type:"button","aria-label":label+" Minuten",onclick:function(){ shift(d); }},[label]); }
  var val = el("button",{type:"button",class:"tval"+(has?"":" sugg"),
    title: has ? "" : "Vorschlag übernehmen",
    onclick:function(){ if (!has) set(k, fmtMin(base)); }},[fmtMin(base)]);
  return el("div",{class:"timepick"},[ b("−1 h",-60), b("−15",-15), val, b("+15",15), b("+1 h",60) ]);
}
/* Schlafdauer sofort ausrechnen: Aufstehen − Zu Bett (Vorabend) − Wach nachts */
function sleepText(){
  var sugg = false;
  function v(k){ var m = toMin(cur[k]); if (m === null) { sugg = true; m = toMin(DEFAULT_TIME[k]); } return m; }
  var dur = ((v("aufstehen") - v("bett")) % 1440 + 1440) % 1440 - v("aufwachen");
  if (dur < 0) dur = 0;
  return { text: Math.floor(dur/60) + ":" + ("0"+(dur%60)).slice(-2), sugg: sugg };
}
function timeHint(k){ return toMin(cur[k]) === null ? " · Vorschlag, antippen zum Übernehmen" : ""; }

/* Bewertung: 11 Knöpfe, Symptome fragen nach der Stufe */
function parseRating(s){
  var items = (s||"").split(",").map(function(x){return x.trim();}).filter(Boolean);
  var base = {}, sym = {}, other = [];
  items.forEach(function(it){
    if (BASE.indexOf(it) >= 0) { base[it] = true; return; }
    for (var i=0;i<SYMPTOMS.length;i++){
      var m = it.indexOf(SYMPTOMS[i]+" ") === 0 ? it.slice(SYMPTOMS[i].length+1) : null;
      if (m && LEVELS.indexOf(m) >= 0) { sym[SYMPTOMS[i]] = m; return; }
    }
    other.push(it);
  });
  return {base:base, sym:sym, other:other};
}
function joinRating(r){
  var out = [];
  BASE.forEach(function(b){ if (r.base[b]) out.push(b); });
  SYMPTOMS.forEach(function(s){ if (r.sym[s]) out.push(s+" "+r.sym[s]); });
  return out.concat(r.other).join(", ");
}
function rating(k){
  var r = parseRating(cur[k]);
  var open = openLevel[k];
  var chips = BASE.map(function(b){
    return el("button",{type:"button",class:"chip"+(r.base[b]?" on":""),onclick:function(){
      if (r.base[b]) delete r.base[b]; else r.base[b] = true; set(k, joinRating(r)); }},[b]);
  });
  SYMPTOMS.forEach(function(s){
    var lvl = r.sym[s];
    var cls = "chip" + (lvl ? " on" : "") + (open===s && !lvl ? " pending" : "");
    chips.push(el("button",{type:"button",class:cls,onclick:function(){
      openLevel[k] = open===s ? null : s; render(); }},
      lvl ? [s, el("span",{class:"lvl",text:lvl})] : [s]));
  });
  r.other.forEach(function(o){
    chips.push(el("button",{type:"button",class:"chip on other",title:"alter Wert",onclick:function(){
      r.other = r.other.filter(function(x){return x!==o;}); set(k, joinRating(r)); }},[o+" ✕"]));
  });
  var kids = [el("div",{class:"seg"},chips)];
  if (open) {
    var lv = el("div",{class:"levels"},[el("b",{text:open+":"})]);
    LEVELS.forEach(function(l){
      lv.appendChild(el("button",{type:"button",class:"chip"+(r.sym[open]===l?" on":""),onclick:function(){
        r.sym[open] = l; openLevel[k] = null; set(k, joinRating(r)); }},[l]));
    });
    if (r.sym[open]) lv.appendChild(el("button",{type:"button",class:"chip",onclick:function(){
      delete r.sym[open]; openLevel[k] = null; set(k, joinRating(r)); }},["entfernen"]));
    kids.push(lv);
  }
  return el("div",{class:"field"},kids);
}

/* Alte Web-App: Verbindungscode für die neue App anzeigen */
var codeShown = null;
function connectBox(){
  var box = el("div",{class:"foot"});
  if (codeShown === null) {
    var b = el("button",{text:"Neue App verbinden"});
    b.addEventListener("click", function(){
      call("getConnectCode").then(function(c){ codeShown = c || ""; render(); }).catch(showError);
    });
    box.appendChild(b);
    return box;
  }
  var card = el("section",{class:"card"},[el("h2",{},["Verbindungscode für die neue App"])]);
  if (!codeShown) {
    card.appendChild(el("div",{class:"notice warn",text:"Noch nicht eingerichtet: In den Skripteigenschaften fehlen API_KEY oder API_URL (siehe Anleitung)."}));
    return card;
  }
  var ta = el("textarea",{readonly:"readonly"}); ta.value = codeShown;
  var copy = el("button",{class:"btn primary",text:"Kopieren"});
  copy.addEventListener("click", function(){
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    var ok = false; try { ok = document.execCommand("copy"); } catch(e){}
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(function(){ toast("Kopiert."); }, function(){ toast(ok ? "Kopiert." : "Bitte lange drücken und „Kopieren“ wählen."); });
    } else toast(ok ? "Kopiert." : "Bitte lange drücken und „Kopieren“ wählen.");
  });
  card.appendChild(el("div",{class:"code"},[
    el("div",{class:"hint",text:"Dieser Code ist wie ein Passwort. Nur in die eigene Logbuch-App einfügen, nicht weitergeben."}),
    ta, copy
  ]));
  return card;
}

function toast(msg, ms){

  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, ms||2600);
}
function showError(e){ toast("Fehler: " + (e && e.message ? e.message : e), 6000); render(); }

function go(delta){
  if (!day || busy) return;

  var i = day.days.indexOf(day.date) + delta;
  if (i >= 0 && i < day.days.length) load(day.days[i]);

    if (r.errors.length) msg += " · " + r.errors.join(" ");

  }).catch(function(e){ btn.disabled = false; btn.textContent = "Speichern"; showError(e); });
